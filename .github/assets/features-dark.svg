   <g fill="none" stroke="#e0b8af" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 10h24M-9 6l6-7 5 4 8-11"/></g></g>
  <text x="30" y="122" class="serif" font-size="25" fill="#ecebe4">Progress</text>
  <text x="30" y="146" class="sans" font-size="15" fill="#9da196">Streaks, hours, readiness ring</text>
  <text x="340" y="62" text-anchor="end" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#9da196">05</text>
 </g></g><g class="card" style="animation-delay:1.05s">
 <g transform="translate(818 210)">
  <rect class="box" width="370" height="160" rx="22" fill="#262923" stroke="#363a33" stroke-width="1.5"/>
  <g transform="translate(52 56)"><circle r="30" fill="#3a3324"/><circle class="halo" r="30" fill="none" stroke="#dcc28a" stroke-width="1.5" style="animation-delay:4.0s"/>
   <g fill="none" stroke="#dcc28a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-2" width="18" height="13" rx="3"/><path d="M-5 -2v-4a5 5 0 0 1 10 0v4"/></g></g>
  <text x="30" y="122" class="serif" font-size="25" fill="#ecebe4">Yours alone</text>
  <text x="30" y="146" class="sans" font-size="15" fill="#9da196">Offline-first, no accounts</text>
  <text x="340" y="62" text-anchor="end" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#9da196">06</text>
