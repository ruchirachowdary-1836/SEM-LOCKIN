<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Features: Day-wise plan, Syllabus tracker, Exam countdown, Focus timer, Progress, Yours alone">
<style>.serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif}
.sans{font-family:'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes halo{0%{transform:scale(1);opacity:.9}70%,100%{transform:scale(1.55);opacity:0}}
.card{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 3s ease-out infinite;opacity:0}
</style>
<g class="card" style="animation-delay:0.15s">
 <g transform="translate(12 14)">
  <rect class="box" width="370" height="160" rx="22" fill="#262923" stroke="#363a33" stroke-width="1.5"/>
  <g transform="translate(52 56)"><circle r="30" fill="#2f362c"/><circle class="halo" r="30" fill="none" stroke="#a3b497" stroke-width="1.5" style="animation-delay:1.5s"/>
   <g fill="none" stroke="#a3b497" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-11" y="-10" width="22" height="20" rx="4"/><path d="M-11 -3h22M-5 -14v6M5 -14v6"/></g></g>
  <text x="30" y="122" class="serif" font-size="25" fill="#ecebe4">Day-wise plan</text>
  <text x="30" y="146" class="sans" font-size="15" fill="#9da196">7 – 23 Nov, concept by concept</text>
  <text x="340" y="62" text-anchor="end" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#9da196">01</text>
 </g></g><g class="card" style="animation-delay:0.33s">
 <g transform="translate(415 14)">
