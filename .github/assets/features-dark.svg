  <g transform="translate(52 56)"><circle r="30" fill="#3a2f2c"/><circle class="halo" r="30" fill="none" stroke="#e0b8af" stroke-width="1.5" style="animation-delay:2.0s"/>
   <g fill="none" stroke="#e0b8af" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -8c-4-3-9-3-12-2v18c3-1 8-1 12 2 4-3 9-3 12-2v-18c-3-1-8-1-12 2zM0 -8v18"/></g></g>
  <text x="30" y="122" class="serif" font-size="25" fill="#ecebe4">Syllabus tracker</text>
  <text x="30" y="146" class="sans" font-size="15" fill="#9da196">Read · notes · revise · test</text>
  <text x="340" y="62" text-anchor="end" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#9da196">02</text>
 </g></g><g class="card" style="animation-delay:0.51s">
 <g transform="translate(818 14)">
  <rect class="box" width="370" height="160" rx="22" fill="#262923" stroke="#363a33" stroke-width="1.5"/>
  <g transform="translate(52 56)"><circle r="30" fill="#3a3324"/><circle class="halo" r="30" fill="none" stroke="#dcc28a" stroke-width="1.5" style="animation-delay:2.5s"/>
   <g fill="none" stroke="#dcc28a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 -4l12-6 12 6-12 6zM-7 -1v6c4 4 10 4 14 0v-6"/></g></g>
  <text x="30" y="122" class="serif" font-size="25" fill="#ecebe4">Exam countdown</text>
