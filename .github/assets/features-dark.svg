   <g fill="none" stroke="#a3b497" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle r="11"/><path d="M0 -6v6l4 3M-4 -15h8"/></g></g>
  <text x="30" y="122" class="serif" font-size="25" fill="#ecebe4">Focus timer</text>
  <text x="30" y="146" class="sans" font-size="15" fill="#9da196">50/10 and 90/15 blocks</text>
  <text x="340" y="62" text-anchor="end" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#9da196">04</text>
 </g></g><g class="card" style="animation-delay:0.87s">
 <g transform="translate(415 210)">
