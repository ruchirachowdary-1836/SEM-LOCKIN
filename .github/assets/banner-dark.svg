<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Semester Lock-In: your semester, your discipline, your results">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1d1a"/><stop offset="1" stop-color="#22251f"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#3a3e36"/></pattern>
  <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#9aaa91" stop-opacity=".55"/><stop offset="1" stop-color="#9aaa91" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#c9a199" stop-opacity=".5"/><stop offset="1" stop-color="#c9a199" stop-opacity="0"/></radialGradient>
  <clipPath id="round"><rect width="1200" height="420" rx="28"/></clipPath>
</defs>
<style>
  .serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif}
  .sans{font-family:'DM Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  @keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,25px)}}
  @keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-20px)}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes shackle{0%,18%{transform:translateY(-9px)}30%,100%{transform:translateY(0)}}
  @keyframes keyhole{0%,28%{fill:#c9a199}36%{fill:#f6efdf}60%,100%{fill:#c9a199}}
  @keyframes pop{0%,24%{transform:scale(1)}32%{transform:scale(1.06)}42%,100%{transform:scale(1)}}
  @keyframes ring{from{stroke-dashoffset:540}to{stroke-dashoffset:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes underline{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
  .ga{animation:floatA 11s ease-in-out infinite}
  .gb{animation:floatB 13s ease-in-out infinite}
  .r1{animation:rise .9s cubic-bezier(.2,.7,.2,1) .2s backwards}
  .r2{animation:rise .9s cubic-bezier(.2,.7,.2,1) .55s backwards}
  .r3{animation:rise .9s cubic-bezier(.2,.7,.2,1) .9s backwards}
  .r4{animation:rise .9s cubic-bezier(.2,.7,.2,1) 1.25s backwards}
  .lock{transform-box:fill-box;transform-origin:center;animation:pop 4s ease-in-out infinite}
  .shackle{animation:shackle 4s cubic-bezier(.5,0,.3,1.4) infinite}
  .kh{animation:keyhole 4s ease-in-out infinite}
  .ring{stroke-dasharray:540;animation:ring 2.6s cubic-bezier(.3,.6,.2,1) 1s backwards}
  .orbit{transform-origin:1010px 210px;animation:spin 18s linear infinite}
  .live{animation:blink 1.6s ease-in-out infinite}
  .ul{stroke-dasharray:420;animation:underline 1.4s ease-out 1.1s backwards}
</style>
<g clip-path="url(#round)">
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)" opacity=".7"/>
  <circle class="ga" cx="260" cy="60" r="260" fill="url(#glowA)"/>
  <circle class="gb" cx="1050" cy="380" r="240" fill="url(#glowB)"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="418.5" rx="27.5" fill="none" stroke="#363a33" stroke-width="1.5"/>

<!-- lock mark -->
<g class="r1">
  <g transform="translate(84 74)"><g class="lock">
    <rect width="64" height="64" rx="16" fill="#75856B"/>
    <path class="shackle" d="M22 30v-6a10 10 0 0 1 20 0v6" fill="none" stroke="#F8F7F2" stroke-width="4" stroke-linecap="round"/>
    <rect x="17" y="29" width="30" height="22" rx="6" fill="#F8F7F2"/>
    <circle class="kh" cx="32" cy="40" r="3.5" fill="#D8B9B2"/>
  </g></g>
  <text x="166" y="114" class="sans" font-size="17" font-weight="700" letter-spacing="5" fill="#ecebe4">SEMESTER LOCK-IN</text>
</g>

<g class="r2">
  <text x="84" y="214" class="serif" font-size="58" fill="#ecebe4">Your semester.</text>
  <text x="84" y="282" class="serif" font-size="58" fill="#ecebe4"><tspan font-style="italic" fill="#a3b497">Your discipline.</tspan> Your results.</text>
  <path class="ul" d="M86 298 C 200 290, 330 304, 498 293" fill="none" stroke="#c9a199" stroke-width="5" stroke-linecap="round"/>
</g>

<g class="r3">
  <text x="84" y="342" class="sans" font-size="20" fill="#9da196">One chapter at a time. One exam at a time. Full marks mindset.</text>
</g>

<g class="r4">
  <circle class="live" cx="92" cy="377" r="5" fill="#a3b497"/>
  <text x="106" y="383" class="sans" font-size="15" font-weight="600" letter-spacing="1.5" fill="#a3b497">LIVE ON GITHUB PAGES</text>
</g>

<!-- readiness ring -->
<g class="r3">
  <circle cx="1010" cy="210" r="118" fill="#262923" stroke="#363a33" stroke-width="1.5"/>
  <g class="orbit"><circle cx="1010" cy="74" r="6" fill="#c9a199"/><circle cx="1146" cy="210" r="4" fill="#9aaa91"/></g>
  <circle cx="1010" cy="210" r="86" fill="none" stroke="#363a33" stroke-width="14"/>
  <circle class="ring" cx="1010" cy="210" r="86" fill="none" stroke="#a3b497" stroke-width="14" stroke-linecap="round" transform="rotate(-90 1010 210)"/>
  <text x="1010" y="214" text-anchor="middle" class="serif" font-size="34" fill="#ecebe4">Locked</text>
  <text x="1010" y="240" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#9da196">SEMESTER READY</text>
</g>
</svg>